name: Android-Linux

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**' # Do not trigger for any changes under docs
  pull_request:
    paths:
      - '.github/workflows/android-linux.yml'
      - 'deploy/android/**'
      - 'src/**'
      - 'android/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'translations/*'

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        BuildType: [Release]

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT: QGroundControl.apk
      PACKAGE: QGroundControl
      QT_VERSION: 6.8.3
      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/qgc-temporary-release.keystore
      QT_ANDROID_KEYSTORE_ALIAS: QGCAndroidKeyStore
      QT_ANDROID_KEYSTORE_STORE_PASS: QGCTemporaryCiKey123
      QT_ANDROID_KEYSTORE_KEY_PASS: QGCTemporaryCiKey123
      QT_ANDROID_ABIS: ${{ matrix.BuildType == 'Release' && 'armeabi-v7a;arm64-v8a' || 'arm64-v8a' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f --depth 1

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Free Disk Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          large-packages: false

      - name: Install Qt for Android
        uses: ./.github/actions/qt-android
        with:
          host: linux
          arch: linux_gcc_64
          version: ${{ env.QT_VERSION }}
          abis: ${{ env.QT_ANDROID_ABIS }}
          cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

      - name: Generate temporary Android keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore "${QT_ANDROID_KEYSTORE_PATH}" \
            -storepass "${QT_ANDROID_KEYSTORE_STORE_PASS}" \
            -keypass "${QT_ANDROID_KEYSTORE_KEY_PASS}" \
            -alias "${QT_ANDROID_KEYSTORE_ALIAS}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=QGroundControl Temporary CI, OU=CI, O=QGroundControl, L=Unknown, ST=Unknown, C=US"

      - name: Pin PX4 GPS drivers for QGC 5.0.8
        env:
          PX4_GPSDRIVERS_COMMIT: 0b9695881bd1e8f830ab4538ab3acc0050019eba
        run: |
          gpsdrivers_dir="${RUNNER_TEMP}/px4-gpsdrivers"
          git init "${gpsdrivers_dir}"
          git -C "${gpsdrivers_dir}" remote add origin https://github.com/PX4/PX4-GPSDrivers.git
          git -C "${gpsdrivers_dir}" fetch --depth 1 origin "${PX4_GPSDRIVERS_COMMIT}"
          git -C "${gpsdrivers_dir}" checkout --detach FETCH_HEAD
          echo "PX4_GPSDRIVERS_SOURCE=${gpsdrivers_dir}" >> "${GITHUB_ENV}"

      - name: Configure
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }}
              -DCMAKE_WARN_DEPRECATED=FALSE
              -DQT_ANDROID_ABIS="${{ env.QT_ANDROID_ABIS }}"
              -DQT_ANDROID_BUILD_ALL_ABIS=OFF
              -DQT_HOST_PATH="${{ env.QT_ROOT_DIR }}/../gcc_64"
              -DQT_ANDROID_SIGN_APK=ON
              -DCPM_px4-gpsdrivers_SOURCE="${PX4_GPSDRIVERS_SOURCE}"
              -DQT_ANDROID_MULTI_ABI_FORWARD_VARS="CPM_px4-gpsdrivers_SOURCE"
              -DQT_DEBUG_FIND_PACKAGE=ON
              -DQGC_STABLE_BUILD=${{ github.ref_type == 'tag' || contains(github.ref, 'Stable') && 'ON' || 'OFF' }}

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: cmake --build . --target all --config ${{ matrix.BuildType }}

      - run: cp ${{ runner.temp }}/shadow_build_dir/android-build/*.apk ${{ runner.temp }}/shadow_build_dir/${{ env.ARTIFACT }}

      - name: Upload Build File
        if: matrix.BuildType == 'Release'
        uses: ./.github/actions/upload
        with:
          artifact_name: ${{ env.ARTIFACT }}
          package_name: ${{ env.PACKAGE }}
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Deploy to Play Store
      #   if: matrix.BuildType == 'Release'
      #   uses: ./.github/actions/playstore
      #   with:
      #     artifact_name: ${{ runner.temp }}/shadow_build_dir/${{ env.ARTIFACT }}
      #     service_account_json: ${{ secrets.SERVICE_ACCOUNT }}
